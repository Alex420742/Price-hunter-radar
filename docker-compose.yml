services:
  price-hunter-radar:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/price_hunter.db
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-false}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - pricehunter-data:/app/data
volumes:
  pricehunter-data:
